<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}}｜幣圈小百科</title>
  <meta name="description" content="{{SUMMARY}}">
  <link rel="stylesheet" href="../assets/style.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="site-name" href="../index.html">幣圈小百科</a>
      <nav class="site-nav"><a href="../index.html">所有概念</a></nav>
    </div>
  </header>

  <main class="wrap concept">
    <a class="back" href="../index.html">← 回首頁</a>
    <!-- 說明：TITLE 是中文名稱（可含常用英文縮寫），TITLE_EN 是英文全名 -->
    <h1>{{TITLE}}</h1>
    <p class="en">{{TITLE_EN}}</p>
    <!-- 說明：CATEGORY 只能用 AGENTS.md 第 4 節列出的分類；LEVEL 只能是「入門」或「進階」；UPDATED 用 YYYY-MM-DD -->
    <div class="meta">
      <span class="tag">{{CATEGORY}}</span>
      <span class="tag level">{{LEVEL}}</span>
      <span>更新日期：{{UPDATED}}</span>
    </div>

    <section id="definition">
      <h2>一句話定義</h2>
      <!-- 說明：只放一個 <p class="lead">，一到兩句話，國中生看得懂 -->
      <p class="lead">{{DEFINITION}}</p>
    </section>

    <section id="how">
      <h2>原理與計算</h2>
      <!-- 說明：指標寫公式（用 <div class="formula">）；機制或幣種寫運作方式。最後放一個 <div class="example"> 的示意範例 -->
      {{HOW}}
    </section>

    <section id="read">
      <h2>怎麼解讀</h2>
      <!-- 說明：用 <ul> 列 3 到 5 點，描述「這個數字或現象通常代表什麼」，不可寫成買賣建議 -->
      {{READ}}
    </section>

    <section id="mistakes">
      <h2>常見誤區</h2>
      <!-- 說明：2 到 3 個 <div class="myth">，格式為「<strong>誤區：</strong>……」加上正確觀念 -->
      {{MISTAKES}}
    </section>

    <section id="related">
      <h2>相關概念</h2>
      <!-- 說明：<ul class="related">，只能連到 concepts/ 裡已存在的頁面，而且對方頁面也要連回來 -->
      {{RELATED}}
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>本站內容僅供學習參考，不構成任何投資建議。範例數字皆為示意，非真實行情。</p>
      <p>幣圈小百科｜依 AGENTS.md 規則由 AI 協作產生</p>
    </div>
  </footer>
</body>
</html>
